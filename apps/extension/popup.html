<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Browser Agent</title>
    <link rel="stylesheet" href="src/popup.css" />
  </head>
  <body>
    <main>
      <h1>Privacy Browser Agent</h1>
      <p class="hint">On-Device Privacy &amp; Browser Automation</p>

      <section class="task-runner">
        <label for="task-input" style="font-size:12px; font-weight:bold; color:#4b5563; display:block; margin-bottom:4px;">Task Instruction:</label>
        <input id="task-input" type="text" placeholder="e.g. Search for privacy agent features" style="width:100%; box-sizing:border-box; padding:8px; border:1px solid #d1d5db; border-radius:6px; margin-bottom:8px; font-size:13px;" />
        <button id="run-task" type="button" style="background:#059669;">Run Agent Task</button>
      </section>

      <!-- Pipeline progress breadcrumb -->
      <section id="pipeline-breadcrumb" style="margin-top:10px; padding:6px 8px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px; font-size:10px; font-family:monospace; line-height:1.4; color:#1e40af;" hidden>
        <strong>PIPELINE:</strong> <span id="pipeline-status">IDLE</span>
      </section>

      <!-- Redacted Information Panel -->
      <section id="redacted-info-panel" style="margin-top:10px; padding:8px 10px; background:#fef2f2; border:1px solid #fecaca; border-radius:6px;" hidden>
        <h2 style="font-size:13px; margin:0 0 4px; color:#991b1b;">Redacted Information</h2>
        <p id="redacted-summary" style="font-size:12px; margin:0; color:#b91c1c; font-family:monospace; word-break:break-all;"></p>
        <div style="margin-top:8px;">
          <button id="copy-redacted-dom" type="button" style="background:#4b5563; padding:6px; font-size:11px;">Copy Redacted DOM</button>
        </div>
      </section>

      <div style="margin-top:12px; border-top:1px solid #e5e7eb; padding-top:10px;">
        <button id="capture" type="button">Capture page metadata</button>
        <button id="scan" class="secondary" type="button">Scan page locally for PII</button>
      </div>

      <p id="status" role="status">Ready. No page content is collected without your consent.</p>
      
      <section id="task-results" hidden>
        <h2>Task Execution Results</h2>
        <p id="task-summary" style="font-size:13px;"></p>
        <ul id="task-actions" style="font-size:12px; padding-left:18px; margin:4px 0;"></ul>
      </section>

      <dl id="metadata" hidden></dl>
      
      <section id="pii-results" hidden>
        <h2>Local PII Scan &amp; Highlighting</h2>
        <p id="pii-summary"></p>
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <button id="toggle-pii-values" type="button" class="secondary" style="font-size:11px; padding:4px 8px;">Show Detected Values</button>
          <button id="clear-highlights" type="button" style="background:#dc2626; font-size:11px; padding:4px 8px;">Clear Highlights</button>
        </div>
        <ul id="pii-list"></ul>
      </section>
    </main>
    <script src="src/popup.js"></script>
  </body>
</html>
