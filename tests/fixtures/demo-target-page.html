<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Verification Portal - SIH Privacy Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-top: 0;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .profile-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .field-row {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 10px;
      color: #1e293b;
    }
    .field-row:last-child {
      margin-bottom: 0;
    }
    .btn-action {
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    #action-status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Identity Verification Dashboard</h1>
    <p class="subtitle">Confidential record requiring verification</p>

    <div class="profile-card">
      <div id="field-name" class="field-row">Name: Shahrukh</div>
      <div id="field-id" class="field-row">ID: hi_23</div>
      <div id="field-email" class="field-row">Email: sde@sf.com</div>
      <div id="field-phone" class="field-row">Phone: 9876543210</div>
    </div>

    <button id="btn-verify" type="button" class="btn-action">Confirm &amp; Proceed</button>
    <div id="action-status" hidden>✔ Action Executed Successfully on Live Webpage!</div>
  </div>

  <script>
    document.getElementById("btn-verify").addEventListener("click", () => {
      const status = document.getElementById("action-status");
      if (status) {
        status.hidden = false;
        status.textContent = "✔ Action Executed Successfully on Live Webpage!";
      }
    });
  </script>
</body>
</html>
