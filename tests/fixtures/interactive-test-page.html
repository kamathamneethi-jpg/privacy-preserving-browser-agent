<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbitrary Webpage Test Fixture</title>
</head>
<body>
  <header>
    <h1>Welcome to Demo Store</h1>
    <nav>
      <a href="https://example.com/docs" id="nav-docs">Explore Docs</a>
      <a href="https://example.com/pricing" id="nav-pricing">Pricing Plans</a>
    </nav>
  </header>

  <main>
    <section id="hero">
      <p>Discover next-generation laptops and privacy-preserving tools.</p>
      <button id="btn-learn-more" type="button">Learn more</button>
    </section>

    <section id="search-section">
      <label for="site-search">Search Products:</label>
      <input type="search" id="site-search" name="searchQuery" placeholder="Search for lightweight laptops" />
      <button id="btn-search" type="button">Search</button>
    </section>

    <section id="registration-form-section">
      <h2>Fill out this form</h2>
      <form id="user-registration-form">
        <label for="name-field">Full Name:</label>
        <input type="text" id="name-field" name="fullName" placeholder="Enter John in the name field" />

        <label for="email-field">Email:</label>
        <input type="email" id="email-field" name="userEmail" placeholder="user@example.com" />

        <label for="country-select">Country:</label>
        <select id="country-select" name="country">
          <option value="">-- Choose Country --</option>
          <option value="IN">India</option>
          <option value="US">United States</option>
          <option value="UK">United Kingdom</option>
          <option value="DE">Germany</option>
        </select>

        <label for="terms-checkbox">
          <input type="checkbox" id="terms-checkbox" name="agreeTerms" />
          Check the terms checkbox
        </label>

        <label for="feedback-area">Feedback:</label>
        <textarea id="feedback-area" name="feedback" placeholder="Optional comments"></textarea>

        <button type="submit" id="btn-submit">Submit</button>
      </form>
    </section>

    <section id="ai-chat-demo-section">
      <h2>AI Chat Features</h2>
      <div class="ai-chat-container" aria-live="polite">
        <div class="chat-message ai-message">Hi! I'm your AI assistant. How can I help you?</div>
        <div class="chat-message user-message">I'm looking for discounts.</div>
        <div class="chat-message ai-message">Check out our deals section!</div>
        <button class="ai-action-button" data-action="search-deals" aria-label="Search for deals on laptops and accessories">Search for deals on laptops and accessories</button>
        <input type="text" class="chat-input" placeholder="Type a message..." aria-label="Chat input field">
        <button class="chat-send-button" aria-label="Send message">Send</button>
      </div>
    </section>

    <section id="login-form-section">
      <h2>Secure Login</h2>
      <form id="login-form">
        <label for="username-login">Username:</label>
        <input type="text" id="username-login" name="username" placeholder="Enter your username" />

        <label for="password-field">Password:</label>
        <input type="password" id="password-field" name="password" placeholder="Enter your password" />

        <label for="security-question-select">Security Question:</label>
        <select id="security-question-select" name="securityQuestion">
          <option value="">-- Select Security Question --</option>
          <option value="mother_maiden">What is your mother's maiden name?</option>
          <option value="city_born">In which city were you born?</option>
          <option value="first_pet">What was the name of your first pet?</option>
        </select>

        <button type="submit" id="btn-login">Login</button>
      </form>
    </section>
  </main>
</body>
</html>
